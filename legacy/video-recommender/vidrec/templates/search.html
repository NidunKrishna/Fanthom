{% extends "base.html" %}
{% from "_video_card.html" import video_card %}
{% block title %}Search - VidRec{% endblock %}

{% block content %}
  <h2>Search results for "{{ query }}"</h2>
  <div class="video-grid">
    {% for v in results %}
      {{ video_card(v) }}
    {% else %}
      <p>No videos found.</p>
    {% endfor %}
  </div>
{% endblock %}
