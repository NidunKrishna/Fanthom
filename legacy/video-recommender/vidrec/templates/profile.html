{% extends "base.html" %}
{% block title %}Profile - VidRec{% endblock %}

{% block content %}
  <div class="profile-header">
    <img src="{{ user.picture }}" alt="avatar" class="avatar-large">
    <div>
      <h2>{{ user.name }}</h2>
      <p>{{ user.email }}</p>
    </div>
  </div>

  <h3>Your activity</h3>
  <table class="history-table">
    <thead>
      <tr><th>Video</th><th>Action</th></tr>
    </thead>
    <tbody>
      {% for v in history %}
        <tr>
          <td><a href="{{ url_for('videos.video_detail', video_id=v.id) }}">{{ v.title }}</a></td>
          <td>{{ v.action }}</td>
        </tr>
      {% else %}
        <tr><td colspan="2">No activity yet. Go watch some videos!</td></tr>
      {% endfor %}
    </tbody>
  </table>
{% endblock %}
